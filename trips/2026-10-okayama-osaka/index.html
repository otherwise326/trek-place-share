<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ee">
  <title>岡山大阪・公開行程</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f2ee;
      --surface: rgba(255, 255, 255, .78);
      --surface-strong: #fffefa;
      --ink: #252624;
      --muted: #73746f;
      --soft: #e8e7e1;
      --line: #deded7;
      --green: #304f42;
      --green-soft: #e5eee7;
      --shadow: 0 16px 38px rgba(42, 48, 42, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 132px; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 100% 0%, rgba(209, 220, 208, .46), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Hiragino Sans", sans-serif;
      line-height: 1.5;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    .page { width: min(100% - 24px, 700px); margin: 0 auto; padding: 0 0 34px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      min-height: 58px;
      padding: 10px 0;
      background: rgba(243, 242, 238, .9);
      backdrop-filter: blur(16px);
    }
    .topbar h1 { position: absolute; left: 50%; margin: 0; transform: translateX(-50%); font-size: 17px; font-weight: 700; letter-spacing: .03em; }
    .top-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--surface-strong);
      color: var(--ink);
      font-size: 20px;
      box-shadow: 0 5px 16px rgba(42, 48, 42, .05);
      text-decoration: none;
    }
    .day-tabs {
      position: sticky;
      top: 58px;
      z-index: 20;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 2px 12px;
      border-bottom: 1px solid rgba(42, 48, 42, .08);
      background: rgba(243, 242, 238, .9);
      backdrop-filter: blur(16px);
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex: 0 0 auto;
      min-width: 96px;
      padding: 9px 14px 10px;
      border: 0;
      border-radius: 999px;
      background: var(--surface-strong);
      color: #555852;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      text-align: left;
      box-shadow: 0 4px 14px rgba(42, 48, 42, .04);
    }
    .day-tab strong { display: block; color: inherit; font-size: 13px; }
    .day-tab span { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; font-weight: 550; }
    .day-tab[aria-selected="true"] { background: #20211f; color: #fff; }
    .day-tab[aria-selected="true"] span { color: #d5d8d2; }
    .day-tab:focus-visible, .map-link:focus-visible { outline: 3px solid #92b19a; outline-offset: 3px; }
    .day-panel { margin-top: 14px; }
    .day-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      padding: 7px 5px 13px;
    }
    .day-heading h2 { margin: 0; font-size: 19px; font-weight: 750; letter-spacing: .02em; }
    .day-heading p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .day-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .timeline {
      position: relative;
      display: grid;
      gap: 10px;
      padding-bottom: 7px;
    }
    .timeline::before {
      content: "";
      position: absolute;
      top: 25px;
      bottom: 25px;
      left: 25px;
      border-left: 1px dashed #c5c9c1;
    }
    .stop {
      position: relative;
      display: grid;
      grid-template-columns: 51px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 10px;
      min-height: 78px;
      padding: 10px 10px 10px 6px;
      border: 1px solid rgba(54, 66, 57, .07);
      border-radius: 21px;
      background: var(--surface-strong);
      box-shadow: 0 8px 21px rgba(42, 48, 42, .045);
    }
    .stop-time { z-index: 1; display: grid; place-items: center; align-self: stretch; color: var(--green); font-size: 13px; font-weight: 760; }
    .stop-time::before {
      content: "";
      position: absolute;
      left: 12px;
      width: 27px;
      height: 27px;
      border: 5px solid var(--surface-strong);
      border-radius: 50%;
      background: var(--green-soft);
      box-shadow: 0 0 0 1px #d4ddd3;
      z-index: -1;
    }
    .stop-body { min-width: 0; }
    .stop-name { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; }
    .stop-category { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .category-icon { display: inline-grid; width: 19px; height: 19px; place-items: center; border-radius: 50%; background: #f0f1ed; color: var(--green); font-size: 11px; font-weight: 800; }
    .map-link {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      background: #20211f;
      color: #fff;
      font-size: 17px;
      text-decoration: none;
    }
    footer { padding: 20px 4px 0; color: #858780; font-size: 11px; text-align: center; }
    @media (min-width: 560px) {
      .page { padding-top: 0; }
      .stop { grid-template-columns: 58px minmax(0, 1fr) 44px; padding-right: 14px; }
      .stop-name { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="公開行程標題列">
      <a class="top-icon" href="../../" aria-label="返回旅程首頁">‹</a>
      <h1>公開行程</h1>
    </header>

    <nav class="day-tabs" id="day-tabs" aria-label="行程天數" role="tablist"></nav>
    <section class="day-panel" id="day-panel" aria-live="polite"></section>
    <footer>由 TREK 行程分享</footer>
  </main>

  <script>
    const categoryLabels = {
      Transport: { label: "交通", icon: "✈" },
      Hotel: { label: "住宿", icon: "⌂" },
      Restaurant: { label: "餐廳", icon: "◒" },
      Activity: { label: "景點", icon: "✦" },
      Shopping: { label: "購物", icon: "▢" }
    };

    const days = [
      {
        number: 1,
        date: "2026-10-18",
        title: "初訪岡山",
        stops: [
          { time: "15:05", name: "岡山 桃太郎機場", category: "Transport", placeId: "ChIJa2konp4DVDURCbtFf9tz9bM" },
          { time: "18:35", name: "岡山 東橫INN 岡山車站東口", category: "Hotel", placeId: "ChIJ96svXEkGVDURM_TEWpgD16U" },
          { time: "19:15", name: "岡山 味司野村", category: "Restaurant", placeId: "ChIJExtR8UkGVDUR8otU2Ytg350" },
          { time: "19:45", name: "岡山 日式居酒屋 Akari", category: "Restaurant", placeId: "ChIJi7k86EkGVDURRzRQjBNFMR4" },
          { time: "20:30", name: "岡山 AEON STYLE", category: "Shopping", placeId: "ChIJ64-LxY0HVDURgSUxSxRo4q8" },
          { time: "21:40", name: "岡山 東橫INN 岡山車站東口", category: "Hotel", placeId: "ChIJ96svXEkGVDURM_TEWpgD16U" }
        ]
      },
      {
        number: 2,
        date: "2026-10-19",
        title: "倉敷美觀＋三井 OUTLET",
        stops: [
          { time: "09:00", name: "岡山 東橫INN 岡山車站東口", category: "Hotel", placeId: "ChIJ96svXEkGVDURM_TEWpgD16U" },
          { time: "09:40", name: "倉敷 阿智神社", category: "Activity", placeId: "ChIJm4wn0DhWUTURnE-3zlklpf8" },
          { time: "10:15", name: "倉敷 美觀地區", category: "Activity", placeId: "ChIJ1do4lkdWUTURvg3rFkFpzhE" },
          { time: "11:25", name: "倉敷 有鄰庵 岡山希少和牛店", category: "Restaurant", placeId: "ChIJBV4HAPZXUTURH26f3sE55mA" },
          { time: "12:35", name: "倉敷 美觀地區", category: "Activity", placeId: "ChIJ1do4lkdWUTURvg3rFkFpzhE" },
          { time: "13:55", name: "倉敷 三井 OUTLET", category: "Shopping", placeId: "ChIJc7EQr1xWUTURZ0IX8YyTBjQ" },
          { time: "19:35", name: "岡山 東橫INN 岡山車站東口", category: "Hotel", placeId: "ChIJ96svXEkGVDURM_TEWpgD16U" }
        ]
      }
    ];

    const categoryLabel = (category) => categoryLabels[category] || { label: "地點", icon: "•" };
    const dateLabel = (date) => new Intl.DateTimeFormat("zh-TW", { month: "numeric", day: "numeric", weekday: "short" }).format(new Date(`${date}T12:00:00`));
    const tabs = document.querySelector("#day-tabs");
    const panel = document.querySelector("#day-panel");

    function renderTabs(activeNumber) {
      tabs.replaceChildren();
      for (const day of days) {
        const tab = document.createElement("button");
        tab.className = "day-tab";
        tab.type = "button";
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", String(day.number === activeNumber));
        tab.setAttribute("aria-controls", "day-panel");
        tab.innerHTML = `<strong>第${day.number}天</strong><span>${dateLabel(day.date)}</span>`;
        tab.addEventListener("click", () => {
          window.location.hash = `day-${day.number}`;
          render(day.number);
        });
        tabs.append(tab);
      }
      const activeTab = tabs.querySelector('[aria-selected="true"]');
      activeTab?.scrollIntoView({ block: "nearest", inline: "center" });
    }

    function render(activeNumber) {
      const day = days.find((item) => item.number === activeNumber) || days[0];
      renderTabs(day.number);
      panel.replaceChildren();

      const heading = document.createElement("div");
      heading.className = "day-heading";
      heading.innerHTML = `<div><h2>第${day.number}天・${day.title}</h2><p>${dateLabel(day.date)}</p></div><span class="day-count">${day.stops.length} 個地點</span>`;
      panel.append(heading);

      const timeline = document.createElement("div");
      timeline.className = "timeline";
      for (const stop of day.stops) {
        const category = categoryLabel(stop.category);
        const item = document.createElement("article");
        item.className = "stop";

        const time = document.createElement("time");
        time.className = "stop-time";
        time.textContent = stop.time;

        const body = document.createElement("div");
        body.className = "stop-body";
        const name = document.createElement("h3");
        name.className = "stop-name";
        name.textContent = stop.name;
        const type = document.createElement("span");
        type.className = "stop-category";
        type.innerHTML = `<span class="category-icon" aria-hidden="true">${category.icon}</span>${category.label}`;
        body.append(name, type);

        const map = document.createElement("a");
        map.className = "map-link";
        map.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.name)}&query_place_id=${stop.placeId}`;
        map.target = "_blank";
        map.rel = "noopener noreferrer";
        map.setAttribute("aria-label", `在 Google Maps 開啟：${stop.name}`);
        map.textContent = "↗";

        item.append(time, body, map);
        timeline.append(item);
      }
      panel.append(timeline);
    }

    const hashNumber = Number(window.location.hash.match(/day-(\d+)/)?.[1]);
    render(days.some((day) => day.number === hashNumber) ? hashNumber : 1);
  </script>
</body>
</html>
