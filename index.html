<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ee">
  <title>旅程｜公開分享</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f2ee;
      --ink: #252624;
      --muted: #777871;
      --glass: rgba(255, 255, 255, .74);
      --line: rgba(38, 41, 37, .09);
      --shadow: 0 22px 55px rgba(43, 47, 42, .12);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(219, 225, 216, .8), transparent 30rem),
        radial-gradient(ellipse at 100% 72%, rgba(236, 218, 205, .55), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Hiragino Sans", sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; -webkit-tap-highlight-color: transparent; }
    .page { width: min(100% - 32px, 760px); margin: 0 auto; padding: 22px 0 46px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      margin-bottom: 48px;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 760; letter-spacing: .1em; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      background: #171817;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 8px 18px rgba(20, 22, 20, .16);
    }
    .top-note { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    .hero { margin-bottom: 30px; }
    .eyebrow { margin: 0 0 9px; color: var(--muted); font-size: 11px; font-weight: 760; letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(32px, 8vw, 52px); font-weight: 760; letter-spacing: .02em; line-height: 1.1; }
    .lead { max-width: 31em; margin: 13px 0 0; color: var(--muted); font-size: 14px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin: 0 2px 13px; }
    .section-title { margin: 0; font-size: 14px; font-weight: 760; letter-spacing: .06em; }
    .section-count { color: var(--muted); font-size: 12px; }
    .trip-card {
      position: relative;
      display: block;
      min-height: 420px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 30px;
      background: #493c3b;
      box-shadow: var(--shadow);
      text-decoration: none;
      isolation: isolate;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .trip-card:hover { transform: translateY(-3px); box-shadow: 0 28px 62px rgba(43, 47, 42, .18); }
    .trip-card:focus-visible { outline: 3px solid rgba(44, 75, 63, .45); outline-offset: 4px; }
    .trip-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: -2; }
    .trip-fallback { position: absolute; inset: 0; z-index: -3; background: linear-gradient(135deg, #273f37, #d37a52 52%, #5c2544); }
    .trip-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(20, 24, 22, .08) 25%, rgba(29, 19, 23, .06) 42%, rgba(25, 16, 25, .82) 100%);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0; }
    .public-badge { padding: 7px 11px; border: 1px solid rgba(255, 255, 255, .32); border-radius: 999px; background: rgba(20, 23, 21, .28); color: #fff; font-size: 11px; font-weight: 720; letter-spacing: .08em; backdrop-filter: blur(12px); }
    .card-arrow { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 50%; background: rgba(15, 16, 15, .74); color: #fff; font-size: 22px; line-height: 1; }
    .card-copy { position: absolute; right: 20px; bottom: 20px; left: 20px; padding: 19px 20px 18px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 22px; background: linear-gradient(110deg, rgba(68, 28, 34, .86), rgba(38, 27, 38, .75)); color: #fff; box-shadow: 0 10px 25px rgba(20, 16, 22, .14); backdrop-filter: blur(13px); }
    .card-kicker { margin: 0 0 7px; color: rgba(255, 255, 255, .74); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .card-title { margin: 0; font-size: clamp(24px, 6vw, 36px); font-weight: 760; letter-spacing: .02em; line-height: 1.15; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 11px; color: rgba(255, 255, 255, .83); font-size: 13px; }
    .card-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .card-meta span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
    .hint { margin: 18px 3px 0; color: var(--muted); font-size: 12px; }
    footer { margin-top: 42px; padding-top: 17px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .03em; }
    @media (max-width: 520px) {
      .page { width: min(100% - 24px, 760px); padding-top: 15px; }
      .topbar { margin-bottom: 39px; }
      .trip-card { min-height: 430px; border-radius: 26px; }
      .card-copy { right: 14px; bottom: 14px; left: 14px; padding: 17px 17px 16px; border-radius: 20px; }
      .card-top { padding: 16px 14px 0; }
      .card-arrow { width: 38px; height: 38px; }
    }
    @media (prefers-reduced-motion: reduce) { .trip-card { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⌁</span><span>TRAVEL SHARED</span></div>
      <span class="top-note">公開旅程</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">MY JOURNEYS</p>
      <h1 id="page-title">旅程</h1>
      <p class="lead">選一趟旅程，查看已整理好的行程表。</p>
    </section>

    <section aria-labelledby="trip-list-title">
      <div class="section-head">
        <h2 id="trip-list-title" class="section-title">可查看的旅程</h2>
        <span class="section-count">1 個旅程</span>
      </div>
      <a class="trip-card" href="./trips/2026-10-okayama-osaka/" aria-label="開啟 2026-10 岡山大阪公開行程">
        <span class="trip-fallback" aria-hidden="true"></span>
        <img class="trip-cover" src="./assets/okayama-osaka-cover.png" alt="岡山與大阪秋日風景" decoding="async">
        <div class="card-top">
          <span class="public-badge">公開分享</span>
          <span class="card-arrow" aria-hidden="true">›</span>
        </div>
        <div class="card-copy">
          <p class="card-kicker">OKAYAMA · OSAKA</p>
          <h2 class="card-title">2026-10 岡山大阪</h2>
          <div class="card-meta">
            <span>2026.10.18 — 2026.10.24</span>
            <span>7 天行程</span>
          </div>
        </div>
      </a>
      <p class="hint">點選旅程卡片即可查看日期、時間軸、地點分類與 Google Maps。</p>
    </section>

    <footer>這是唯讀的公開分享頁，不會連線讀取你的私人 TREK 資料。</footer>
  </main>
</body>
</html>
