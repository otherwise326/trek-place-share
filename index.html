<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">
  <title>岡山・地點散策</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1eb;
      --card: #fffefa;
      --ink: #202722;
      --muted: #69736d;
      --green: #315e4a;
      --line: #d9dfd5;
      --shadow: 0 14px 36px rgba(31, 48, 38, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 100% 0%, rgba(201, 218, 202, .38), transparent 34rem),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Hiragino Sans", sans-serif;
      line-height: 1.5;
    }
    .page { width: min(100% - 28px, 680px); margin: 0 auto; padding: 24px 0 42px; }
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 218px;
      padding: 30px 27px;
      border-radius: 30px;
      color: #f8f5ec;
      background: linear-gradient(135deg, #264b3c, #416d55 62%, #789174);
      box-shadow: var(--shadow);
    }
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero::before { width: 310px; height: 310px; right: -108px; top: -156px; }
    .hero::after { width: 215px; height: 215px; right: -62px; top: -107px; }
    .eyebrow { margin: 0 0 13px; color: #d3dfcf; font-size: 12px; letter-spacing: .16em; }
    h1 { position: relative; margin: 0; font-size: clamp(30px, 8vw, 46px); font-weight: 650; letter-spacing: .04em; }
    .hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; }
    .hero-foot p { margin: 0; color: #e2e9dc; font-size: 14px; }
    .count { flex: none; padding: 8px 13px; border: 1px solid rgba(255,255,255,.34); border-radius: 999px; font-size: 13px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; margin: 28px 4px 16px; }
    .section-head h2 { margin: 0; font-size: 19px; letter-spacing: .04em; }
    .section-head span { color: var(--muted); font-size: 12px; }
    .places { position: relative; display: grid; gap: 12px; }
    .places::before { content: ""; position: absolute; top: 31px; bottom: 31px; left: 24px; border-left: 1px dashed #bdc9bd; }
    .place {
      position: relative;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 88px;
      padding: 14px 14px 14px 10px;
      border: 1px solid rgba(49, 94, 74, .08);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 8px 22px rgba(31, 48, 38, .045);
    }
    .marker {
      z-index: 1;
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 5px solid var(--card);
      border-radius: 50%;
      background: #e8eee5;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 0 0 1px #d6e0d4;
    }
    .place h3 { margin: 0; font-size: 15px; font-weight: 620; line-height: 1.4; }
    .map-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 0 11px;
      border-radius: 999px;
      background: #edf2eb;
      color: #315e4a;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }
    .map-link:focus-visible { outline: 3px solid #87aa8e; outline-offset: 2px; }
    footer { padding: 22px 4px 0; color: #798179; font-size: 12px; text-align: center; }
    @media (min-width: 560px) {
      .page { padding-top: 38px; }
      .hero { min-height: 255px; padding: 38px 38px; }
      .place { grid-template-columns: 54px minmax(0, 1fr) auto; padding: 17px 18px 17px 12px; }
      .place h3 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">OKAYAMA · PLACES</p>
      <h1>岡山散策</h1>
      <div class="hero-foot">
        <p>收藏在地圖上的幾個地方</p>
        <span class="count" id="place-count"></span>
      </div>
    </header>

    <section aria-labelledby="places-title">
      <div class="section-head">
        <h2 id="places-title">地點</h2>
        <span>點開地圖繼續探索</span>
      </div>
      <div class="places" id="places"></div>
    </section>
    <footer>岡山 · 地點散策</footer>
  </main>

  <script>
    const places = [
      { name: "岡山 桃太郎機場", placeId: "ChIJa2konp4DVDURCbtFf9tz9bM" },
      { name: "岡山 東橫INN 岡山車站東口", placeId: "ChIJ96svXEkGVDURM_TEWpgD16U" },
      { name: "岡山 味司野村", placeId: "ChIJExtR8UkGVDUR8otU2Ytg350" },
      { name: "岡山 日式居酒屋 Akari", placeId: "ChIJi7k86EkGVDURRzRQjBNFMR4" },
      { name: "岡山 AEON STYLE", placeId: "ChIJ64-LxY0HVDURgSUxSxRo4q8" }
    ];

    const container = document.querySelector("#places");
    document.querySelector("#place-count").textContent = `${places.length} 個地點`;
    for (const [index, place] of places.entries()) {
      const item = document.createElement("article");
      item.className = "place";

      const marker = document.createElement("span");
      marker.className = "marker";
      marker.setAttribute("aria-hidden", "true");
      marker.textContent = String(index + 1).padStart(2, "0");

      const heading = document.createElement("h3");
      heading.textContent = place.name;

      const link = document.createElement("a");
      link.className = "map-link";
      link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}&query_place_id=${place.placeId}`;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `在 Google 地圖開啟：${place.name}`);
      link.textContent = "地圖 ↗";

      item.append(marker, heading, link);
      container.append(item);
    }
  </script>
</body>
</html>
